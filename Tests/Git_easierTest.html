        score = 0;
        resultsScreen.classList.add('hidden');
        questionArea.classList.remove('hidden');
        document.querySelector('div.mb-6').classList.remove('hidden'); // Show header
        nextBtn.classList.add('hidden');
        showQuestion();
    }

    function showQuestion() {
        resetState();
        const currentQuestion = quizData[currentQuestionIndex];
        const questionNumber = currentQuestionIndex + 1;
        
        // Update question text and progress
        questionText.innerHTML = `${questionNumber}. ${currentQuestion.question.replace(/`([^`]+)`/g, '<code class="bg-slate-200 dark:bg-slate-700 px-1.5 py-0.5 rounded-md font-mono text-sm">$1</code>')}`;
        progressText.innerText = `Въпрос ${questionNumber} / ${quizData.length}`;
        progressBar.style.width = `${(questionNumber / quizData.length) * 100}%`;

        // Create answer buttons
        currentQuestion.answerOptions.forEach(answer => {
            const button = document.createElement('button');
            button.innerHTML = answer.text.replace(/`([^`]+)`/g, '<code class="bg-slate-200 dark:bg-slate-600 px-1 py-0.5 rounded font-mono text-sm">$1</code>');
            button.classList.add('answer-btn', 'w-full', 'text-left', 'p-4', 'rounded-lg', 'border', 'border-slate-300', 'dark:border-slate-600', 'bg-slate-50', 'dark:bg-slate-800', 'hover:bg-slate-200', 'dark:hover:bg-slate-700', 'disabled:opacity-50', 'disabled:cursor-not-allowed');
            button.dataset.correct = answer.isCorrect;
            button.dataset.rationale = answer.rationale;
            button.addEventListener('click', selectAnswer);
            answerButtons.appendChild(button);
        });
    }

    function resetState() {
        nextBtn.classList.add('hidden');
        rationaleArea.classList.add('hidden');
        while (answerButtons.firstChild) {
            answerButtons.removeChild(answerButtons.firstChild);
        }
    }

    function selectAnswer(e) {
        const selectedBtn = e.currentTarget;
        const isCorrect = selectedBtn.dataset.correct === 'true';

        if (isCorrect) {
            score++;
            selectedBtn.classList.remove('bg-slate-50', 'dark:bg-slate-800');
            selectedBtn.classList.add('bg-green-100', 'dark:bg-green-900', 'border-green-500', 'dark:border-green-500');
        } else {
            selectedBtn.classList.remove('bg-slate-50', 'dark:bg-slate-800');
            selectedBtn.classList.add('bg-red-100', 'dark:bg-red-900', 'border-red-500', 'dark:border-red-500');
        }
        
        // Show rationale
        const rationale = selectedBtn.dataset.rationale;
        rationaleText.innerHTML = rationale.replace(/`([^`]+)`/g, '<code class="bg-slate-200 dark:bg-slate-600 px-1.5 py-0.5 rounded-md font-mono text-sm">$1</code>');
        rationaleArea.classList.remove('hidden');
        rationaleArea.className = `mt-6 p-4 rounded-lg border-l-4 ${isCorrect ? 'bg-green-50 dark:bg-green-900/50 border-green-500' : 'bg-red-50 dark:bg-red-900/50 border-red-500'}`;
        rationaleTitle.innerText = isCorrect ? 'Правилно!' : 'Грешен отговор!';
        rationaleTitle.className = `font-bold mb-1 ${isCorrect ? 'text-green-700 dark:text-green-300' : 'text-red-700 dark:text-red-300'}`;


        Array.from(answerButtons.children).forEach(button => {
            if (button.dataset.correct === 'true') {
                 button.classList.remove('bg-slate-50', 'dark:bg-slate-800');
                 button.classList.add('bg-green-100', 'dark:bg-green-900', 'border-green-500');
            }
            button.disabled = true;
        });

        nextBtn.classList.remove('hidden');
    }

    function showResults() {
        questionArea.classList.add('hidden');
        document.querySelector('div.mb-6').classList.add('hidden'); // Hide header
        nextBtn.classList.add('hidden');
        rationaleArea.classList.add('hidden');
        resultsScreen.classList.remove('hidden');
        scoreText.textContent = `${score} / ${quizData.length}`;
    }

    function handleNextButton() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            showQuestion();
        } else {
            showResults();
        }
    }

    nextBtn.addEventListener('click', handleNextButton);
    restartBtn.addEventListener('click', startQuiz);

    startQuiz();
</script>
</body>
</html>
